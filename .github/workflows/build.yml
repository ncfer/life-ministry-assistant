name: Build

# Compiles LifeMinistryAssistant into a single-file executable on real
# Windows and macOS runners — PyInstaller can't cross-compile from Linux,
# so this is the whole reason the workflow exists: no local VM, no local
# Mac, just push and download the artifact a few minutes later.
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --onefile --windowed --name LifeMinistryAssistant --add-data "assets;assets" app_entry.py
      - uses: actions/upload-artifact@v7
        with:
          name: LifeMinistryAssistant-windows
          path: dist/LifeMinistryAssistant.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install -r requirements.txt
      # No --onefile here: PyInstaller warns it doesn't make sense combined
      # with a windowed macOS .app bundle (a .app can't be a single file
      # anyway) and says this becomes a hard error in PyInstaller v7.0.
      # onedir (the default without --onefile) is what a proper .app is
      # built from regardless — Windows keeps --onefile since a single
      # portable .exe is the actual goal there.
      - run: python -m PyInstaller --windowed --name LifeMinistryAssistant --add-data "assets:assets" app_entry.py
      - uses: actions/upload-artifact@v7
        with:
          name: LifeMinistryAssistant-macos
          path: dist/LifeMinistryAssistant.app

  # Pushing a v* tag publishes a release with both builds attached. The
  # in-app update check (assistant/updates.py) reads the latest release
  # from the API, so a version that never becomes a release is a version
  # nobody gets told about.
  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Zip each build
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../$name.zip" .)
          done
      # Pinned to a commit SHA, not a tag: this is a third-party
      # action running with contents:write, and a mutable tag can be
      # repointed at different code without anything here changing.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
